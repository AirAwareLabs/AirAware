services:
  - type: web
    name: airaware-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    port: 8080
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ApiKey
        sync: false # set manually in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false # comma-separated list of allowed CORS origins
      - key: DATABASE_URL
        fromDatabase:
          name: airaware-db
          property: connectionString

databases:
  - name: airaware-db
    plan: free
